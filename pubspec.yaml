name: proteus_visor
description: >-
  3D viewer of Proteus, the simulated amoeba with a Cartesian theatre: replays
  recorded runs and streams live ones, with flutter_scene.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  # flutter_scene 0.22 exige el primer estable con el Flutter GPU que usa.
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # El de pub.dev, como en el spike de Nairda (el fork de Nairda no se toca).
  flutter_scene: ^0.22.2
  vector_math: ^2.2.0
  web_socket_channel: ^3.0.0
  # Solo `package:proteus/visor.dart`: la grabación en Dart puro.
  proteus:
    path: ../proteus

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # `- assets/` no incluye subdirectorios (trampa medida en Nairda).
    - assets/grabaciones/
